services:

  postgres:
    image: postgres:17.11
    container_name: employee-ai-postgres
    environment:
      POSTGRES_DB: employee_ai
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5433:5432"
    volumes:
      - employee_ai_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8.6.1
    container_name: redis-container
    ports:
      - "6379:6379"

volumes:
  employee_ai_postgres_data: